name: Android アプリをビルド

# app/ 以下（アプリ部分）を変更したときに、APK を作って「Releases」に置く。
# 画面（index.html・app.js など）の変更は、アプリを開いたときに自動で反映されるので、ビルドは不要。
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# 外部のアクションは書き換えられても影響を受けないよう、版をコミットIDで固定している
permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 署名鍵が登録されているか確認
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=署名鍵が未登録です::Settings → Secrets and variables → Actions に KEYSTORE_BASE64 と KEYSTORE_PASSWORD を登録してください"
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Capacitor の準備
        working-directory: app
        run: |
          npm ci
          npx cap sync android

      - name: 署名鍵を復元
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK をビルド
        working-directory: app/android
        env:
          DF_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          DF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DF_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: 失敗したときはエラー行を表示
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            grep -E "error:|e: |FAILURE|What went wrong|Could not|> " "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: 名前をそろえる
        run: cp app/android/app/build/outputs/apk/release/app-release.apk daily-flow.apk

      - name: Releases に置く
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Daily Flow アプリ 1.0.${{ github.run_number }}
          files: daily-flow.apk
          make_latest: true
          body: |
            スマホでこのページを開き、下の **daily-flow.apk** をタップしてダウンロード → 開いてインストールします。
            すでに入っている場合は上書き更新されます（データはそのまま）。
